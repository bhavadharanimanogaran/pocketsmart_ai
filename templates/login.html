{% extends "base.html" %}

{% block title %}
Login · PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-card">

    <h1>
        Welcome back
    </h1>

    <p>
        Log in to continue your plans.
    </p>


    <form method="post" action="/login">

        <label>
            Email

            <input name="email" type="email" required>

        </label>


        <label>
            Password

            <input name="password" type="password" required>

        </label>


        <button class="btn primary" type="submit">
            Login
        </button>

    </form>


    <p class="muted">

        No account?

        <a href="/register">
            Create one
        </a>

    </p>

</div>

{% endblock %}
