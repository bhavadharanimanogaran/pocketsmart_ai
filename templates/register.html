{% extends "base.html" %}

{% block title %}
Register · PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-card">

    <h1>
        Create your account
    </h1>

    <p>
        Save your recommendations
        and revisit them later.
    </p>

    <center>
        <form method="post" action="/register">

            <label>
                Name

                <input name="name" type="text" required minlength="3">

            </label><br>


            <label>
                Email

                <input name="email" type="email" required>

            </label><br>


            <label>Password<input name="password" type="password" required minlength="6"></label>
            <br>


            <button class="btn primary" type="submit">
                Register
            </button>

        </form>
    </center>


    <p class="muted">

        Already registered?

        <a href="/login">
            Login
        </a>

    </p>

</div>

{% endblock %}
